name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare env
        run: cp .env.example .env.dev

      - name: Install dependencies
        run: flutter pub get

      - name: Generate translations
        run: dart run slang

      - name: Verify formatting
        run: dart format --line-length 120 --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Check screen sizes
        run: ./tool/check_sizes.sh

      - name: Test
        run: flutter test --coverage --dart-define-from-file=.env.dev

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info
