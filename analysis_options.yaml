include: package:very_good_analysis/analysis_options.yaml

formatter:
  page_width: 120

analyzer:
  exclude:
    - build/**
    - lib/core/i18n/strings*.g.dart
    - android/**
    - ios/**

linter:
  rules:
    lines_longer_than_80_chars: false
    public_member_api_docs: false
    sort_pub_dependencies: false
    avoid_setters_without_getters: false
    # Ambas reglas empujan sintaxis nueva de Dart, menos legible para quien revisa.
    unnecessary_type_name_in_constructor: false
    prefer_initializing_formals: false
    # Choca con callbacks ValueChanged<bool> (switches) pasados como tear-off.
    avoid_positional_boolean_parameters: false
