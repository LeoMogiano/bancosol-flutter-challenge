# Sized for 16 GB / 5-core machines running IDE + emulator alongside Gradle.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Kotlin daemon would otherwise inherit the Gradle heap; native Kotlin here is tiny.
kotlin.daemon.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon.idletimeout=1800000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
